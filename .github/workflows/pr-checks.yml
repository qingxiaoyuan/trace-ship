name: PR 质量检查

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, build]
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CHECK_NAME: ${{ matrix.check }}
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 记录运行环境
        run: |
          report_dir="$RUNNER_TEMP/pr-checks/frontend-$CHECK_NAME"
          mkdir -p "$report_dir"
          printf 'CHECK_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            uname -a
            node --version
            npm --version
          } > "$report_dir/environment.txt"
      - name: 安装前端依赖
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$CHECK_REPORT_DIR/install.log"
          npm ls --all --json > "$CHECK_REPORT_DIR/dependencies.json"
      - name: 执行前端检查
        id: check
        run: |
          set -o pipefail
          if [ "$CHECK_NAME" = test ]; then
            npm run test -- --reporter=default --reporter=junit --outputFile.junit="$CHECK_REPORT_DIR/junit.xml" 2>&1 | tee "$CHECK_REPORT_DIR/check.log"
          else
            if [ "$CHECK_NAME" = lint ]; then
              npm run test:runtime 2>&1 | tee "$CHECK_REPORT_DIR/runtime-check.log"
            fi
            npm run "$CHECK_NAME" 2>&1 | tee "$CHECK_REPORT_DIR/check.log"
          fi
      - name: 记录检查结论
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            printf '## 前端 %s\n\n' "$CHECK_NAME"
            printf '| 阶段 | 实际结果 |\n| --- | --- |\n'
            printf '| 依赖安装 | %s |\n' "$INSTALL_OUTCOME"
            printf '| 检查 | %s |\n' "$CHECK_OUTCOME"
            printf '\n构建包含 TypeScript 检查。已知失败仅作独立记录，不转换为通过；详见 docs/agents/check-baselines.md。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存前端检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-${{ matrix.check }}-${{ github.run_attempt }}
          path: ${{ env.CHECK_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: 后端 / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test]
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      CHECK_NAME: ${{ matrix.check }}
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: 记录运行环境
        run: |
          report_dir="$RUNNER_TEMP/pr-checks/backend-$CHECK_NAME"
          mkdir -p "$report_dir"
          printf 'CHECK_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            uname -a
            python --version
            python -m pip --version
          } > "$report_dir/environment.txt"
      - name: 执行隔离 Linux 后端检查
        id: check
        run: |
          set -o pipefail
          python scripts/checks/backend-linux.py "$CHECK_NAME" --report-dir "$CHECK_REPORT_DIR" 2>&1 | tee "$CHECK_REPORT_DIR/check.log"
      - name: 记录检查结论
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            printf '## 后端 %s\n\n' "$CHECK_NAME"
            printf '| 阶段 | 实际结果 |\n| --- | --- |\n'
            printf '| 镜像构建及检查 | %s |\n' "$CHECK_OUTCOME"
            printf '\npytest 沿用配置中的全量覆盖范围和 50%% 门槛。覆盖率达标不代表测试通过。\n'
            printf '\n与本地共用 Linux 检查镜像和入口，实际容器环境见归档；Windows 已知失败单独见 docs/agents/check-baselines.md。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存后端检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-${{ matrix.check }}-${{ github.run_attempt }}
          path: ${{ env.CHECK_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

  postgresql:
    name: 后端 / PostgreSQL 并发锁
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: 记录运行环境
        run: |
          report_dir="$RUNNER_TEMP/pr-checks/postgresql"
          mkdir -p "$report_dir"
          printf 'CHECK_REPORT_DIR=%s\n' "$report_dir" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            uname -a
            python --version
            docker --version
            docker compose version
          } > "$report_dir/environment.txt"
      - name: 执行隔离 PostgreSQL 并发锁检查
        id: check
        run: |
          set -o pipefail
          python scripts/checks/backend-postgresql.py --report-dir "$CHECK_REPORT_DIR" 2>&1 | tee "$CHECK_REPORT_DIR/check-output.txt"
      - name: 记录检查结论
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            printf '## PostgreSQL 并发锁\n\n'
            printf '| 阶段 | 实际结果 |\n| --- | --- |\n'
            printf '| 镜像构建、临时数据库、7 项真实并发验证及清理 | %s |\n' "$CHECK_OUTCOME"
            printf '\n独立内部网络，无业务数据库连接或宿主端口。JUnit 出现跳过、失败、执行数不符均失败；原 SQLite 全量与覆盖率门槛独立保留。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存 PostgreSQL 并发证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-postgresql-${{ github.run_attempt }}
          path: ${{ env.CHECK_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  package-real:
    name: 打包 / 真实执行
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      CHECK_REPORT_DIR: ${{ github.workspace }}/tmp/pr-checks/package-real
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: 执行真实本地 Docker 打包验收
        id: check
        run: python scripts/checks/package-real.py --report-dir "$CHECK_REPORT_DIR"
      - name: 记录检查结论
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            printf '## 真实本地 Docker 打包\n\n'
            printf '| 阶段 | 实际结果 |\n| --- | --- |\n'
            printf '| 固定版本构建、日志与下载、Tag 漂移阻断及资源清理 | %s |\n' "$CHECK_OUTCOME"
            printf '\n使用隔离虚构软件、真实 Git 与生产任务执行器，不连接业务数据库或组织 GitLab，不推送 SVN。环境、身份、校验摘要与清理结果见归档。\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存真实打包验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-real-${{ github.run_attempt }}
          path: ${{ env.CHECK_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

  browser:
    name: 浏览器 / 冒烟验收
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      CHECK_REPORT_DIR: ${{ github.workspace }}/tmp/pr-checks/browser
      CHECK_PYTHON: python
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: 安装隔离验收依赖
        run: |
          set -o pipefail
          mkdir -p "$CHECK_REPORT_DIR"
          npm ci 2>&1 | tee "$CHECK_REPORT_DIR/npm-install.log"
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev
          python -m pip install -r ../backend/requirements-dev.txt 2>&1 | tee "$CHECK_REPORT_DIR/python-install.log"
          npx playwright install --with-deps chromium 2>&1 | tee "$CHECK_REPORT_DIR/browser-install.log"
      - name: 执行真实浏览器冒烟
        run: npm run test:browser
      - name: 保存浏览器验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-smoke-${{ github.run_attempt }}
          path: ${{ env.CHECK_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 30
