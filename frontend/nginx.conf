server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 使用 Docker 内置 DNS 运行时解析 backend，避免后端容器重启换 IP 后
    # nginx 仍连旧 IP 导致 502（nginx 默认启动时一次性解析并缓存主机名）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端路由支持：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端服务（变量形式触发运行时 DNS 解析）
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;

        # 镜像 tar 包等大文件上传，放开请求体大小限制（nginx 默认 1MB 会返回 413）
        client_max_body_size 0;

        # 镜像导入（docker load）耗时较长，放宽超时避免 504
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ico、svg、字体、图片等静态资源长期缓存
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
