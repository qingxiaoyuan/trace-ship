const MAX_STACK=3;

function avatar(name){ return AVATARS[name]||AVATARS['张三']; }
function badge(type){ const t=TYPE_MAP[type]; return `<span class="rounded border px-1 py-0.5 text-[9px] font-medium ${t.cls}">${t.text}</span>`; }
function statusBadge(status){ const s=STATUS_MAP[status]; return `<span class="rounded-md border px-1.5 py-0.5 text-[11px] font-medium ${s.badge}">${s.label}</span>`; }

function stackCard(r, index, hidden) {
  const s = STATUS_MAP[r.status];
  const isTop = index === 0;
  const zClass = `stack-card-${index}`;
  const click = isTop ? `onclick="openModal('${r.id}')"` : '';
  const corner = isTop && hidden > 0 ? `<span class="absolute right-2 top-2 rounded-full bg-slate-100 px-1.5 py-0.5 text-[10px] font-semibold text-slate-500">+${hidden}</span>` : '';
  const content = isTop
    ? `<div class="flex items-start justify-between gap-2"><span class="font-mono text-[12px] font-medium text-slate-800">${r.version}</span>${badge(r.type)}</div>
       <div class="mt-1 truncate text-[11px] text-slate-500">${r.project}</div>
       <div class="mt-2 flex items-center gap-1 text-[10px] text-slate-400"><i data-lucide="git-branch" class="h-3 w-3 flex-shrink-0" style="stroke-width:1.5"></i><span class="truncate">${r.branch}</span></div>
       <div class="mt-2 flex items-center gap-1.5"><img src="${avatar(r.publisher)}" alt="" class="h-4 w-4 rounded-full object-cover ring-1 ring-white"><span class="text-[10px] text-slate-400">${r.publisher} · ${r.time}</span></div>`
    : `<div class="flex items-start justify-between gap-2"><span class="font-mono text-[12px] font-medium text-slate-800">${r.version}</span>${badge(r.type)}</div>
       <div class="mt-1 truncate text-[11px] text-slate-500">${r.project}</div>`;

  return `<div ${click} class="stack-card ${zClass} ${isTop ? 'cursor-pointer border ' + s.cardBorder + ' shadow-sm hover:-translate-y-0.5 hover:shadow-md' : 'border'} p-3">${corner}${content}</div>`;
}

function renderBoard(){
  const groups={}; COLUMNS.forEach(c=>groups[c.key]=[]);
  RELEASES.forEach(r=>{ if(groups[r.status]) groups[r.status].push(r); });
  const board=document.getElementById('board');
  board.innerHTML=COLUMNS.map(col=>{
    const items=groups[col.key];
    const count=items.length;
    const visible=items.slice(0,MAX_STACK);
    const hidden=count-visible.length;
    const s=STATUS_MAP[col.key];
    let stack='';
    if(count===0){
      stack=`<div class="flex flex-col items-center justify-center rounded-lg border border-dashed border-slate-200 bg-white/60 py-10 text-[12px] text-slate-400"><i data-lucide="layers" class="mb-2 h-5 w-5 text-slate-300" style="stroke-width:1.5"></i>暂无</div>`;
    }else{
      stack=`<div class="card-stack relative">`;
      if(hidden>0) stack+=`<button type="button" onclick="event.stopPropagation();openDrawer('${col.key}')" class="column-more">+${hidden}</button>`;
      visible.forEach((r,i)=>{
        stack += stackCard(r, i, i === 0 ? 0 : 0);
      });
      stack+=`</div>`;
    }
    return `
      <div class="rounded-xl border ${s.border} ${s.bg} p-3">
        <div class="mb-3 flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full ${s.dot}"></span>
            <span class="text-[12px] font-medium ${s.text}">${s.label}</span>
          </div>
          <span class="rounded-md bg-white/80 px-1.5 py-0.5 text-[11px] font-semibold ${s.text}">${count}</span>
        </div>
        ${stack}
      </div>
    `;
  }).join('');
  lucide.createIcons();
}

function commitRow(c){
  const icon=c.reviewStatus==='pass'?'check-circle-2':c.reviewStatus==='warning'?'triangle-alert':'x-circle';
  const color=c.reviewStatus==='pass'?'text-emerald-500':c.reviewStatus==='warning'?'text-amber-500':'text-rose-500';
  const type=c.type?`<span class="mr-1.5 rounded border border-slate-200 bg-slate-50 px-1 py-0.5 text-[10px] font-medium text-slate-600">${c.type}</span>`:'';
  return `
    <div class="flex items-center gap-3 py-2.5">
      <span class="font-mono text-[11px] text-indigo-500 w-16">${c.hash}</span>
      <div class="flex-1 truncate text-[13px] text-slate-700">${type}${c.message}</div>
      <img src="${avatar(c.author)}" alt="" class="h-4 w-4 rounded-full object-cover ring-1 ring-white">
      <i data-lucide="${icon}" class="h-3.5 w-3.5 ${color}" style="stroke-width:1.5"></i>
    </div>
  `;
}

function timelineHtml(status){
  const steps=[
    {icon:'file-text',label:'创建发布',desc:'草稿已保存'},
    {icon:'hammer',label:'Jenkins 构建',desc:'自动触发'},
    {icon:'git-pull-request-arrow',label:'提交审批',desc:'等待审批人'},
    {icon:'check-circle-2',label:'审批完成',desc:'允许发布'},
    {icon:'tag',label:'推送 Tag',desc:'发布完成'}
  ];
  const order={draft:0,building:1,pending:2,released:4,rejected:1};
  const idx=order[status]??0;
  return `<div class="space-y-0">${steps.map((step,i)=>{
    let state;
    if(status==='rejected'){ state=i===0?'done':(i===1?'active-red':'pending'); }
    else{ state=i<idx?'done':(i===idx?'active':'pending'); }
    const node=state==='done'?'bg-emerald-500 text-white':state==='active'?'bg-indigo-600 text-white':state==='active-red'?'bg-rose-500 text-white':'border-2 border-slate-200 bg-white text-slate-300';
    const line=i<4?(state==='done'?'bg-emerald-200':'bg-slate-200'):'';
    const text=state==='pending'?'text-slate-400':state==='active-red'?'text-rose-700':'text-slate-900';
    return `
      <div class="flex gap-3">
        <div class="flex flex-col items-center">
          <div class="flex h-7 w-7 items-center justify-center rounded-full ${node}"><i data-lucide="${step.icon}" class="h-3.5 w-3.5" style="stroke-width:1.5"></i></div>
          ${i<4?`<div class="w-px flex-1 ${line} mt-1"></div>`:''}
        </div>
        <div class="pb-5">
          <div class="text-[13px] font-medium ${text}">${step.label}</div>
          <div class="mt-0.5 text-[11px] text-slate-400">${step.desc}</div>
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

function buildPane(build){
  if(!build) return '<div class="text-[13px] text-slate-500">暂无构建记录</div>';
  const ok=typeof build.progress==='number';
  const color=ok?'icon-cyan':'icon-emerald';
  const icon=ok?'loader':'check-circle-2';
  return `
    <div class="flex items-center gap-3 rounded-lg border border-indigo-100 bg-white p-3 mb-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg ${color}"><i data-lucide="${icon}" class="h-[18px] w-[18px]" style="stroke-width:1.5"></i></div>
      <div class="flex-1">
        <div class="text-[13px] font-medium text-slate-900">构建 #${build.number}</div>
        <div class="text-[11px] text-slate-500">${build.job} · ${build.duration}</div>
      </div>
    </div>
    ${ok?`<div class="h-1 w-full overflow-hidden rounded-full bg-cyan-100"><div class="h-full rounded-full bg-gradient-to-r from-cyan-400 to-indigo-400" style="width:${build.progress}%"></div></div>`:''}
  `;
}

function notesHtml(r){
  return `
    <div class="text-slate-400"># ${r.version}</div>
    <div class="text-emerald-600 font-medium mt-1.5">## 变更摘要</div>
    <div class="pl-3">- ${r.desc}</div>
    <div class="text-blue-600 font-medium mt-1.5">## 影响范围</div>
    <div class="pl-3">- ${r.project} · ${r.branch}</div>
    <div class="text-violet-600 font-medium mt-1.5">## 注意事项</div>
    <div class="pl-3">- 请在低峰期发布，并确认 Jenkins 构建成功。</div>
  `;
}

function infoItem(icon,label,value){
  return `
    <div class="flex items-center gap-3 rounded-lg border border-indigo-100 bg-white p-3">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg icon-indigo">
        <i data-lucide="${icon}" class="h-4 w-4" style="stroke-width:1.5"></i>
      </div>
      <div class="min-w-0">
        <div class="text-[11px] text-slate-400">${label}</div>
        <div class="truncate text-[13px] font-medium text-slate-800">${value}</div>
      </div>
    </div>
  `;
}

function modalContent(r){
  const counts={pass:0,warning:0,illegal:0};
  r.commits.forEach(c=>{ if(counts[c.reviewStatus]!==undefined) counts[c.reviewStatus]++; });
  return `
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 border-b border-indigo-50 px-6 py-5">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl icon-indigo">
          <i data-lucide="rocket" class="h-5 w-5" style="stroke-width:1.5"></i>
        </div>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h2 class="text-[20px] font-semibold tracking-tight text-slate-900 font-mono">${r.version}</h2>
            ${badge(r.type)}
            ${statusBadge(r.status)}
          </div>
          <p class="mt-0.5 text-[12px] text-slate-500">${r.project} · ${r.branch}</p>
        </div>
      </div>
      <button onclick="closeModal()" class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-indigo-50 hover:text-indigo-600 self-start sm:self-auto">
        <i data-lucide="x" class="h-4 w-4" style="stroke-width:1.5"></i>
      </button>
    </div>

    <div class="overflow-y-auto p-6 scrollbar-thin">
      <div class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
        ${infoItem('git-branch','来源分支',r.branch)}
        ${infoItem('tag','目标 Tag',r.tag)}
        ${infoItem('user','发布人',r.publisher)}
        ${infoItem('clock','发布时间',r.time)}
        ${infoItem('git-commit-horizontal','提交数',`${r.commits.length} 条`)}
        ${infoItem('hammer','构建',r.build?`#${r.build.number} · ${r.build.job}`:'未触发')}
      </div>

      <div class="mb-6 rounded-xl border border-indigo-100 bg-white p-4">
        <h3 class="mb-4 text-[14px] font-semibold tracking-tight text-slate-900">发布流程</h3>
        ${timelineHtml(r.status)}
      </div>

      <div>
        <div class="mb-4 flex items-center gap-1 border-b border-indigo-50">
          <button onclick="switchTab('commits')" id="tab-commits" class="dt-tab on rounded-t-lg border-b-2 border-indigo-600 px-3 py-2.5 text-[13px] font-medium text-indigo-600">关联提交</button>
          <button onclick="switchTab('build')" id="tab-build" class="dt-tab rounded-t-lg border-b-2 border-transparent px-3 py-2.5 text-[13px] font-medium text-slate-500 hover:text-indigo-600">构建信息</button>
          <button onclick="switchTab('notes')" id="tab-notes" class="dt-tab rounded-t-lg border-b-2 border-transparent px-3 py-2.5 text-[13px] font-medium text-slate-500 hover:text-indigo-600">发布说明</button>
        </div>
        <div id="pane-commits" class="dt-pane rounded-xl border border-indigo-100 bg-white p-4">
          <div class="flex items-center justify-between mb-3">
            <span class="text-[12px] text-slate-500">上一个 tag <span class="font-mono text-slate-700">${r.version.replace(/\.\d+$/,'.'+(parseInt(r.version.match(/\d+$/)||0)-1))}</span> → <span class="font-mono text-slate-700">${r.branch}</span></span>
            <span class="rounded-full bg-indigo-50 px-2 py-0.5 text-[11px] font-semibold text-indigo-600">${counts.pass} 合规 · ${counts.warning} 警告</span>
          </div>
          <div class="divide-y divide-indigo-50/50">${r.commits.map(commitRow).join('')}</div>
        </div>
        <div id="pane-build" class="dt-pane hidden rounded-xl border border-indigo-100 bg-white p-4">${buildPane(r.build)}</div>
        <div id="pane-notes" class="dt-pane hidden rounded-xl border border-indigo-100 bg-slate-50/50 p-4 font-mono text-[12px] text-slate-600 leading-relaxed">${notesHtml(r)}</div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 border-t border-indigo-50 bg-slate-50/50 px-6 py-4">
      <button onclick="closeModal()" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-[13px] font-medium text-slate-600 hover:border-slate-300 hover:bg-slate-50">关闭</button>
      ${r.status==='pending'?`
        <button class="rounded-lg border border-rose-200 bg-white px-4 py-2 text-[13px] font-medium text-rose-600 hover:bg-rose-50">驳回</button>
        <button class="btn-glow rounded-lg px-4 py-2 text-[13px] font-medium text-white">通过审批</button>
      `:''}
    </div>
  `;
}

function openModal(id){
  const r=RELEASES.find(x=>x.id===id);
  if(!r) return;
  document.getElementById('modalInner').innerHTML=modalContent(r);
  document.getElementById('modalMask').classList.add('open');
  document.getElementById('modalPanel').classList.add('open');
  document.body.style.overflow='hidden';
  lucide.createIcons();
}

function closeModal(){
  document.getElementById('modalMask').classList.remove('open');
  document.getElementById('modalPanel').classList.remove('open');
  document.body.style.overflow='';
}

function switchTab(name){
  ['commits','build','notes'].forEach(t=>{
    document.getElementById('pane-'+t).classList.add('hidden');
    const btn=document.getElementById('tab-'+t);
    btn.classList.remove('on','border-indigo-600','text-indigo-600');
    btn.classList.add('border-transparent','text-slate-500');
  });
  document.getElementById('pane-'+name).classList.remove('hidden');
  const active=document.getElementById('tab-'+name);
  active.classList.add('on','border-indigo-600','text-indigo-600');
  active.classList.remove('border-transparent','text-slate-500');
}

function openDrawer(colKey){
  const s=STATUS_MAP[colKey];
  const items=RELEASES.filter(r=>r.status===colKey);
  const drawer=document.getElementById('drawerPanel');
  drawer.innerHTML=`
    <div class="flex h-full flex-col">
      <div class="flex items-center justify-between border-b border-indigo-50 px-5 py-4">
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full ${s.dot}"></span>
          <h2 class="text-[16px] font-semibold tracking-tight text-slate-900">${s.label}</h2>
          <span class="rounded-md bg-slate-100 px-2 py-0.5 text-[12px] font-semibold text-slate-600">${items.length}</span>
        </div>
        <button onclick="closeDrawer()" class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 hover:bg-indigo-50 hover:text-indigo-600">
          <i data-lucide="x" class="h-4 w-4" style="stroke-width:1.5"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 scrollbar-thin">
        <div class="space-y-3">
          ${items.map(r=>`
            <div onclick="openModal('${r.id}');closeDrawer();" class="cursor-pointer rounded-xl border ${s.cardBorder} bg-white p-4 shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md">
              <div class="flex items-start justify-between gap-2">
                <span class="font-mono text-[13px] font-medium text-slate-800">${r.version}</span>
                ${badge(r.type)}
              </div>
              <div class="mt-1 truncate text-[12px] text-slate-500">${r.project}</div>
              <div class="mt-2 flex items-center gap-1 text-[11px] text-slate-400">
                <i data-lucide="git-branch" class="h-3 w-3 flex-shrink-0" style="stroke-width:1.5"></i>
                <span class="truncate">${r.branch}</span>
              </div>
              <div class="mt-3 flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                  <img src="${avatar(r.publisher)}" alt="" class="h-4 w-4 rounded-full object-cover ring-1 ring-white">
                  <span class="text-[11px] text-slate-500">${r.publisher}</span>
                </div>
                <span class="text-[11px] text-slate-400">${r.time}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('drawerMask').classList.add('open');
  document.getElementById('drawerPanel').classList.add('open');
  document.body.style.overflow='hidden';
  lucide.createIcons();
}

function closeDrawer(){
  document.getElementById('drawerMask').classList.remove('open');
  document.getElementById('drawerPanel').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!document.getElementById('drawerPanel').classList.contains('open')) closeModal();
    else closeDrawer();
  }
});
renderBoard();
</script>
</body>
</html>
