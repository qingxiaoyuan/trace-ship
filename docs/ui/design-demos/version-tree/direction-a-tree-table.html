<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace Ship · 产品版本二级树 · 方向A</title>
</head>
<body style="margin:0;min-height:100vh;background-color:#F6F7FB;font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#334155;font-synthesis:none;line-break:strict;">
  <!--
     ASSUMPTIONS / 设计假设
    1. 本稿只验证产品详情「发布版本」中的二级结构，不改动任何业务代码和接口。
    2. 一级节点是软件仓库，二级节点是该仓库的发布版本；不出现「组件」或「组件名称」等额外概念。
    3. 默认容量为 3～8 个仓库、每仓库 3～20 个版本。父行只承载仓库摘要，子行沿用现有发布表格字段。
    4. 方向 A 追求最低迁移成本和最高横向扫描效率，适合作为产品详情与打包看板共用的基础树表。
    5. 视觉完全沿用项目的亮色后台令牌：白色卡片、淡靛蓝边框、靛蓝主色、青蓝辅助色、低饱和状态色和 12px 圆角。
    6. 展开箭头、仓库、分支、搜索、发布等图形均按 Lucide 的 1.5px 线性图标语法绘制。
  -->
  <div style="min-height:100vh;background-image:linear-gradient(rgba(99,102,241,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.045) 1px,transparent 1px);background-size:48px 48px;">
    <main style="max-width:1320px;margin:0 auto;padding:24px 30px 48px;">
      <nav style="display:flex;align-items:center;gap:8px;margin:0 0 18px;color:#94A3B8;font-size:13px;">
        <span>产品</span><span style="color:#CBD5E1;">›</span><span style="color:#334155;">ces</span><span style="margin-left:auto;color:#6366F1;font-size:12px;">方向 A · 可展开树表</span>
      </nav>

      <section style="background:#FFFFFF;border:1px solid #E0E7FF;border-radius:12px;padding:22px 20px 16px;box-shadow:0 0 0 1px rgba(99,102,241,.03);margin-bottom:20px;">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div style="width:46px;height:46px;border-radius:11px;background:#EEF2FF;border:1px solid #C7D2FE;display:flex;align-items:center;justify-content:center;color:#4F46E5;" data-icon="folder" data-size="22"></div>
          <div style="min-width:220px;flex:1;">
            <div style="display:flex;align-items:center;gap:9px;">
              <h1 style="margin:0;color:#0F172A;font-size:21px;line-height:1.3;font-weight:650;">ces</h1>
              <span style="font-size:12px;color:#059669;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:6px;padding:2px 7px;">● 启用</span>
            </div>
            <div style="margin-top:6px;font-size:12px;color:#64748B;font-variant-numeric:tabular-nums;">PROJ202607280001 · 负责人 系统管理员 · 创建于 2026-07-28</div>
          </div>
          <button style="height:38px;border:1px solid #C7D2FE;border-radius:8px;background:#FFFFFF;color:#475569;padding:0 14px;display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;" type="button"><span data-icon="rocket" data-size="16"></span>新建发布</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;border-top:1px solid #EEF2FF;margin-top:18px;padding-top:14px;font-size:12px;color:#64748B;">
          <div><span style="color:#6366F1;margin-right:8px;">⌘</span>软件仓库 <b style="color:#0F172A;margin-left:7px;">3</b></div>
          <div><span style="color:#06B6D4;margin-right:8px;">⌁</span>打包配置 <b style="color:#0F172A;margin-left:7px;">3</b></div>
          <div><span style="color:#8B5CF6;margin-right:8px;">♙</span>成员 <b style="color:#0F172A;margin-left:7px;">3</b></div>
          <div><span style="color:#10B981;margin-right:8px;">↗</span>累计发布 <b style="color:#0F172A;margin-left:7px;">9</b></div>
        </div>
      </section>

      <section style="background:#FFFFFF;border:1px solid #E0E7FF;border-radius:12px;box-shadow:0 0 0 1px rgba(99,102,241,.03);overflow:hidden;">
        <div style="display:flex;gap:28px;align-items:center;overflow-x:auto;padding:0 26px;border-bottom:1px solid #E0E7FF;white-space:nowrap;font-size:13px;color:#64748B;">
          <span style="padding:14px 0;">基本信息</span><span>软件仓库</span><span>成员</span><span>打包配置</span><span>SVN 制品</span><span style="padding:14px 0 12px;color:#4F46E5;border-bottom:2px solid #4F46E5;">发布版本</span>
        </div>
        <div style="padding:20px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <label style="height:36px;width:min(280px,100%);border:1px solid #C7D2FE;border-radius:8px;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 11px;color:#94A3B8;">
              <span data-icon="search" data-size="15"></span>
              <input id="searchA" placeholder="搜索仓库、版本号或 Tag" style="border:0;outline:0;width:100%;font:inherit;font-size:13px;color:#334155;background:transparent;" />
            </label>
            <button id="expandA" type="button" style="height:36px;padding:0 12px;border:1px solid #E0E7FF;border-radius:8px;background:#FFFFFF;color:#475569;font-size:12px;cursor:pointer;">全部展开</button>
            <div style="margin-left:auto;font-size:12px;color:#94A3B8;">共 3 个仓库 · 9 个版本</div>
          </div>

          <div style="border:1px solid #E0E7FF;border-radius:11px;overflow:auto;">
            <div style="min-width:1040px;">
              <div style="display:grid;grid-template-columns:2.4fr 1.8fr 1.1fr 1.2fr 1.35fr .45fr;gap:16px;padding:10px 18px;background:#FAFBFF;border-bottom:1px solid #E0E7FF;color:#94A3B8;font-size:11px;font-weight:650;letter-spacing:.04em;">
                <span>软件仓库 / 版本号</span><span>TAG</span><span>发布类型</span><span>发布人</span><span>发布时间</span><span style="text-align:right;">操作</span>
              </div>
              <div id="treeA"></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:12px;color:#94A3B8;font-size:12px;">
            <span style="width:7px;height:7px;border-radius:50%;background:#4F46E5;"></span>
            仓库作为一级节点，版本作为二级节点；收起后仍保留当前版本与发布数量。
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const iconPathsA = {
      folder:'<path d="M3 6.5h6l2 2h10v10.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 12v5M12 10v7M16 13v4"/>',
      rocket:'<path d="M4.5 16.5c-1.5 1.2-2 3.8-2 3.8s2.6-.5 3.8-2"/><path d="M9 15l-3-3c2.5-5.5 7.4-8.8 14-8-.8 6.6-4.1 11.5-9.6 14z"/><circle cx="15" cy="9" r="2"/>',
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
      repo:'<circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v7a5 5 0 0 0 5 5h5M18 17V8M15 11l3-3 3 3"/>',
      chevronDown:'<path d="m8 10 4 4 4-4"/>',
      chevronRight:'<path d="m10 7 5 5-5 5"/>'
    };
    function svgA(name,size=16,color='currentColor'){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPathsA[name]||''}</svg>`}
    document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=svgA(el.dataset.icon,el.dataset.size||16)});

    const reposA = [
      {id:'backend',name:'E2E Backend Service',path:'e2e/backend-service',current:'VA.1.0.2',expanded:true,latest:'2026-08-27 16:06',versions:[
        ['VA.1.0.0','VA.1.0.0-rc_20260827','RC','系统管理员','2026-08-27 16:06'],
        ['VA.1.0.2','VA.1.0.2_20260818','正式','系统管理员','2026-08-18 19:08'],
        ['VA.1.0.1','VA.1.0.1_20260811','正式','系统管理员','2026-08-11 10:32'],
        ['VA.1.0.0','VA.1.0.0','正式','系统管理员','2026-07-28 16:07']]},
      {id:'middleware',name:'E2E Middleware Core',path:'e2e/middleware-core',current:'VM.2.3.0',expanded:false,latest:'2026-08-25 11:18',versions:[
        ['VM.2.3.0','VM.2.3.0_20260825','正式','测试管理员','2026-08-25 11:18'],
        ['VM.2.3.0-beta','VM.2.3.0-beta_20260822','Beta','测试管理员','2026-08-22 09:41'],
        ['VM.2.2.5','VM.2.2.5_20260803','正式','系统管理员','2026-08-03 14:26']]},
      {id:'web',name:'E2E Web Console',path:'e2e/web-console',current:'VW.1.8.4',expanded:false,latest:'2026-08-24 17:42',versions:[
        ['VW.1.8.4','VW.1.8.4_20260824','正式','测试软件管理员','2026-08-24 17:42'],
        ['VW.1.8.3','VW.1.8.3-rc_20260820','RC','测试软件管理员','2026-08-20 15:03']]}
    ];
    const typeStyleA = {正式:['#EEF2FF','#4F46E5'],RC:['#E0F2FE','#0369A1'],Beta:['#FFFBEB','#B45309']};
    function renderA(keyword=''){
      const kw=keyword.trim().toLowerCase();
      const root=document.getElementById('treeA');
      root.innerHTML='';
      reposA.forEach(repo=>{
        const matchesRepo=!kw||`${repo.name} ${repo.path}`.toLowerCase().includes(kw);
        const matches=repo.versions.filter(v=>!kw||v.join(' ').toLowerCase().includes(kw));
        if(!matchesRepo&&matches.length===0)return;
        const shown=kw ? (matchesRepo?repo.versions:matches) : repo.versions;
        const open=kw?true:repo.expanded;
        const wrap=document.createElement('section');wrap.dataset.repo=repo.id;
        wrap.innerHTML=`
          <button type="button" data-toggle="${repo.id}" style="width:100%;border:0;border-bottom:1px solid #E0E7FF;background:#F8FAFF;display:grid;grid-template-columns:2.4fr 1.8fr 1.1fr 1.2fr 1.35fr .45fr;gap:16px;align-items:center;padding:13px 18px;text-align:left;cursor:pointer;color:#334155;">
            <span style="display:flex;align-items:center;gap:10px;min-width:0;">
              <span style="color:#6366F1;display:flex;">${svgA(open?'chevronDown':'chevronRight',15)}</span>
              <span style="width:30px;height:30px;border:1px solid #C7D2FE;border-radius:8px;background:#EEF2FF;color:#4F46E5;display:flex;align-items:center;justify-content:center;flex:none;">${svgA('repo',15)}</span>
              <span style="min-width:0;"><strong style="display:block;color:#0F172A;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${repo.name}</strong><small style="display:block;color:#94A3B8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${repo.path}</small></span>
            </span>
            <span style="font-size:12px;color:#64748B;">当前版本 <b style="font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#4F46E5;font-weight:600;">${repo.current}</b></span>
            <span style="font-size:12px;color:#64748B;">${repo.versions.length} 个版本</span>
            <span style="font-size:12px;color:#64748B;">已发布</span>
            <span style="font-size:12px;color:#64748B;font-variant-numeric:tabular-nums;">${repo.latest}</span>
            <span style="text-align:right;color:#C7D2FE;">${svgA('chevronRight',15)}</span>
          </button>
          <div data-children="${repo.id}" style="display:${open?'block':'none'};position:relative;"><span style="position:absolute;left:36px;top:0;bottom:22px;border-left:1px solid #C7D2FE;z-index:2;pointer-events:none;"></span>${shown.map((v,i)=>{
            const c=typeStyleA[v[2]]||['#F1F5F9','#64748B'];
            return `<div style="display:grid;grid-template-columns:2.4fr 1.8fr 1.1fr 1.2fr 1.35fr .45fr;gap:16px;align-items:center;padding:11px 18px;border-bottom:1px solid #F1F5F9;background:#FFFFFF;font-size:12px;">
              <span style="display:flex;align-items:center;gap:10px;padding-left:42px;position:relative;color:#0F172A;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;"><span style="position:absolute;left:18px;top:50%;width:14px;border-top:1px solid #C7D2FE;z-index:3;"></span><span style="width:25px;height:25px;border-radius:7px;background:#EEF2FF;color:#6366F1;display:flex;align-items:center;justify-content:center;flex:none;z-index:3;">${svgA('rocket',13)}</span>${v[0]}</span>
              <span title="${v[1]}" style="font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${v[1]}</span>
              <span><em style="font-style:normal;border-radius:6px;padding:3px 8px;background:${c[0]};color:${c[1]};font-weight:600;">● ${v[2]}</em></span>
              <span>${v[3]}</span><span style="color:#64748B;font-variant-numeric:tabular-nums;">${v[4]}</span><span style="text-align:right;color:#CBD5E1;">${svgA('chevronRight',15)}</span>
            </div>`}).join('')}</div>`;
        root.appendChild(wrap);
      });
      root.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const r=reposA.find(x=>x.id===btn.dataset.toggle);r.expanded=!r.expanded;renderA(document.getElementById('searchA').value)}));
    }
    renderA();
    document.getElementById('searchA').addEventListener('input',e=>renderA(e.target.value));
    document.getElementById('expandA').addEventListener('click',e=>{const shouldOpen=reposA.some(r=>!r.expanded);reposA.forEach(r=>r.expanded=shouldOpen);e.currentTarget.textContent=shouldOpen?'全部折叠':'全部展开';renderA(document.getElementById('searchA').value)});
  </script>
</body>
</html>
