# Trace Ship 生产环境 Compose 编排
# 仅包含应用运行必需的服务：PostgreSQL / Redis / Backend / Frontend / Celery
# 第三方开发依赖（Gitea / OpenLDAP / SVN / Jenkins）不纳入，生产环境请按需接入外部服务。
#
# 使用方式：
#   1. cp .env.prod.example .env.prod 并填写真实配置
#   2. ./start-prod.sh  或  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  # PostgreSQL 主库（仅内部网络访问，不对外暴露端口）
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:${POSTGRES_VERSION:-16}
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-postgres
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trace_ship_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/队列（仅内部网络访问，不对外暴露端口）
  redis:
    image: ${IMAGE_PREFIX:-}redis:${REDIS_VERSION:-7}
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-redis
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - trace_ship_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Trace Ship 后端（镜像内打包代码，不挂载源码卷）
  backend:
    image: trace-ship/backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      # 容器网络内服务发现地址（覆盖 .env.prod 中可能存在的本地值）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # 安全密钥（必填，prod.py 会校验不能为默认值）
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      # CORS：生产强制关闭全放行
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 打包工作区根目录：宿主机与容器内必须路径一致，DooD 下构建容器才能正确挂载源码
      PACKAGE_WORKSPACE_ROOT: ${PACKAGE_WORKSPACE_ROOT:?PACKAGE_WORKSPACE_ROOT must be set}
    volumes:
      - backend_logs:/var/log/trace-ship
      # 挂载宿主机 Docker socket，使容器内可调用宿主机 docker 执行打包任务
      - /var/run/docker.sock:/var/run/docker.sock
      # 打包工作区：bind mount 到与宿主机一致的路径，保证构建容器 -v 挂载路径有效
      - ${PACKAGE_WORKSPACE_ROOT}:${PACKAGE_WORKSPACE_ROOT}
    networks:
      - trace_ship_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Trace Ship 前端（nginx 提供静态资源并反代 /api/ 到 backend）
  frontend:
    image: trace-ship/frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-frontend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - trace_ship_net
    depends_on:
      - backend

  # Celery Worker（使用与 backend 相同的镜像，执行异步任务）
  celery-worker:
    image: trace-ship/backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOW_ALL_ORIGINS: "False"
      PACKAGE_WORKSPACE_ROOT: ${PACKAGE_WORKSPACE_ROOT:?PACKAGE_WORKSPACE_ROOT must be set}
    volumes:
      # Celery worker 也会执行打包任务，需要 docker socket 和共享工作区
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PACKAGE_WORKSPACE_ROOT}:${PACKAGE_WORKSPACE_ROOT}
    networks:
      - trace_ship_net
    depends_on:
      - backend
      - redis

  # Celery Beat（定时任务调度）
  celery-beat:
    image: trace-ship/backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOW_ALL_ORIGINS: "False"
    volumes:
      - celerybeat_schedule:/app
    networks:
      - trace_ship_net
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  celerybeat_schedule:

networks:
  trace_ship_net:
    driver: bridge
