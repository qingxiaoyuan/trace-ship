# Trace Ship 生产环境 Compose 编排（应用层）
# 仅包含应用服务：Backend / Frontend / Celery Worker / Celery Beat。
# 第三方依赖（PostgreSQL / Redis / GitLab）在 docker-compose.deps.yml 中独立编排，
# 本文件通过外部共享网络 trace-ship-net 以服务名（postgres / redis / gitlab）访问。
#
# 前置条件：先启动依赖并等待 PostgreSQL / Redis 健康
#   docker compose --env-file .env.prod -f docker-compose.deps.yml up -d
# （start-prod.sh / deploy.sh 已自动按此顺序执行，日常运维只需操作本文件）
#
# 使用方式：
#   1. cp .env.prod.example .env.prod 并填写真实配置
#   2. ./start-prod.sh  或  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

name: trace-ship

services:
  # Trace Ship 后端（镜像内打包代码，不挂载源码卷）
  backend:
    image: trace-ship/backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      # 容器网络内服务发现地址（覆盖 .env.prod 中可能存在的本地值）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # 安全密钥（必填，prod.py 会校验不能为默认值）
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      # CORS：生产强制关闭全放行
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 打包工作区根目录：宿主机与容器内必须路径一致，DooD 下构建容器才能正确挂载源码
      PACKAGE_WORKSPACE_ROOT: ${PACKAGE_WORKSPACE_ROOT:?PACKAGE_WORKSPACE_ROOT must be set}
      # 发布预览单分支最大提交扫描数（可选，默认 100）
      RELEASE_PREVIEW_MAX_COMMITS: ${RELEASE_PREVIEW_MAX_COMMITS:-100}
      # Nexus 仓库连接（打包镜像选择使用，可选）
      NEXUS_BASE_URL: ${NEXUS_BASE_URL:-}
      NEXUS_USERNAME: ${NEXUS_USERNAME:-}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD:-}
      NEXUS_REGISTRY_HOST: ${NEXUS_REGISTRY_HOST:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_logs:/var/log/trace-ship
      # 挂载宿主机 Docker socket，使容器内可调用宿主机 docker 执行打包任务。
      # 注意：这等价于授予容器宿主机 root 能力，仅限受控内网环境使用。
      - /var/run/docker.sock:/var/run/docker.sock
      # 打包工作区：bind mount 到与宿主机一致的路径，保证构建容器 -v 挂载路径有效（DooD 硬性要求）
      - ${PACKAGE_WORKSPACE_ROOT}:${PACKAGE_WORKSPACE_ROOT}
    networks:
      - trace_ship_net
    # 注意：依赖服务在独立的 compose 项目中，无法使用 depends_on；
    # 启动顺序与依赖健康等待由 start-prod.sh / deploy.sh 保证

  # Trace Ship 前端（nginx 提供静态资源并反代 /api/ 到 backend）
  frontend:
    image: trace-ship/frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-frontend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - trace_ship_net
    depends_on:
      - backend

  # Celery Worker（使用与 backend 相同的镜像，执行异步任务）
  celery-worker:
    image: trace-ship/backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOW_ALL_ORIGINS: "False"
      PACKAGE_WORKSPACE_ROOT: ${PACKAGE_WORKSPACE_ROOT:?PACKAGE_WORKSPACE_ROOT must be set}
    volumes:
      # Celery worker 也会执行打包任务，需要 docker socket 和共享工作区（DooD 硬性要求）
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PACKAGE_WORKSPACE_ROOT}:${PACKAGE_WORKSPACE_ROOT}
    networks:
      - trace_ship_net
    depends_on:
      - backend

  # Celery Beat（定时任务调度）
  celery-beat:
    image: trace-ship/backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship}-celery-beat
    restart: unless-stopped
    # 调度状态文件放在独立数据卷，严禁把卷直接挂到 /app（会覆盖应用代码导致无法启动）
    command: celery -A config beat -l info -s /app/celerybeat-data/schedule
    env_file:
      - .env.prod
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOW_ALL_ORIGINS: "False"
    volumes:
      - celerybeat_data:/app/celerybeat-data
    networks:
      - trace_ship_net
    depends_on:
      - backend

# 应用层数据卷同样显式命名为 trace-ship-*
volumes:
  backend_logs:
    name: trace-ship-backend-logs
  celerybeat_data:
    name: trace-ship-celerybeat-data

# 共享网络由 docker-compose.deps.yml 创建，本文件以 external 方式加入
networks:
  trace_ship_net:
    external: true
    name: trace-ship-net
