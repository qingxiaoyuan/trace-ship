services:
  # PostgreSQL 主库
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:${POSTGRES_VERSION:-16}
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-postgres
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-release_manager}
      POSTGRES_USER: ${POSTGRES_USER:-release_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ReleaseManager@2024}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trace_ship_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-release_manager} -d ${POSTGRES_DB:-release_manager}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/会话/任务队列
  redis:
    image: ${IMAGE_PREFIX:-}redis:${REDIS_VERSION:-7}
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-redis
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-ReleaseManager@2024} --appendonly yes
    networks:
      - trace_ship_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # GitLab 仓库（代码仓库唯一平台：分支/提交/MR/tag）
  # 注意：GitLab 较重量级（建议 4GB+ 可用内存），首次启动需等待数分钟
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce}:${GITLAB_VERSION:-14.10.5-ce.0}
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-gitlab
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-GitlabAdmin@2024}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_HTTP_PORT:-18929}'
        nginx['listen_port'] = 80
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        # 开发环境降低资源占用
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        prometheus['enable'] = false
    ports:
      - "${GITLAB_HTTP_PORT:-18929}:80"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - trace_ship_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # OpenLDAP 域账号服务（测试环境模拟，本地构建，避免依赖 Docker Hub 第三方镜像可用性）
  openldap:
    profiles:
      - test
    build: ./openldap
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-openldap
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-LDAPAdmin@2024}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAP_SSL_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/openldap/openldap-data
    networks:
      - trace_ship_net

  # phpLDAPadmin LDAP 管理界面（测试环境模拟）
  phpldapadmin:
    profiles:
      - test
    image: ${IMAGE_PREFIX:-}osixia/phpldapadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-phpldapadmin
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8090}:80"
    networks:
      - trace_ship_net
    depends_on:
      - openldap

  # SVN 仓库服务（测试环境模拟：打包产物推送目标，本地构建）
  svn:
    profiles:
      - test
    build: ./svn
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-svn
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${SVN_PORT:-3690}:3690"
      - "${SVN_HTTP_PORT:-3691}:80"
    volumes:
      - svn_data:/var/svn
    networks:
      - trace_ship_net

  # Trace Ship 后端服务
  backend:
    profiles:
      - app
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-backend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      # 数据库
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-release_manager}
      DB_USER: ${POSTGRES_USER:-release_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ReleaseManager@2024}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ReleaseManager@2024}
      # LDAP（需以 --profile test 启动 openldap 后可用）
      LDAP_SERVER_URI: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD:-LDAPAdmin@2024}
      LDAP_USER_SEARCH_BASE: ou=users,dc=example,dc=com
      # Django
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set for production settings}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set for production settings}
      # 凭证加密
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set for production settings}
      # CORS
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      # 发布预览单分支最大提交扫描数（可选，默认 100）
      RELEASE_PREVIEW_MAX_COMMITS: ${RELEASE_PREVIEW_MAX_COMMITS:-100}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    networks:
      - trace_ship_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Trace Ship 前端服务
  frontend:
    profiles:
      - app
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-frontend
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    networks:
      - trace_ship_net
    depends_on:
      - backend

  # Celery Worker
  celery-worker:
    profiles:
      - app
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-release_manager}
      DB_USER: ${POSTGRES_USER:-release_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ReleaseManager@2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ReleaseManager@2024}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set for production settings}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set for production settings}
    volumes:
      - ../backend:/app
    networks:
      - trace_ship_net
    depends_on:
      - backend
      - redis

  # Celery Beat
  celery-beat:
    profiles:
      - app
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-trace-ship-dev}-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info -s /app/celerybeat-data/schedule
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-release_manager}
      DB_USER: ${POSTGRES_USER:-release_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ReleaseManager@2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ReleaseManager@2024}
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set for production settings}
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?CREDENTIAL_SECRET_KEY must be set for production settings}
    volumes:
      - ../backend:/app
      - celerybeat_data:/app/celerybeat-data
    networks:
      - trace_ship_net
    depends_on:
      - backend
      - redis

# 数据卷统一显式命名为 trace-ship-*，不依赖 compose 项目名前缀，
# 避免更换 COMPOSE_PROJECT_NAME 时误建空卷导致数据"丢失"
volumes:
  postgres_data:
    name: trace-ship-postgres-data
  redis_data:
    name: trace-ship-redis-data
  gitlab_config:
    name: trace-ship-gitlab-config
  gitlab_logs:
    name: trace-ship-gitlab-logs
  gitlab_data:
    name: trace-ship-gitlab-data
  ldap_data:
    name: trace-ship-ldap-data
  svn_data:
    name: trace-ship-svn-data
  celerybeat_data:
    name: trace-ship-celerybeat-data

networks:
  trace_ship_net:
    driver: bridge
    ipam:
      config:
        # 注意避开 172.28.0.0/16：生产数据层编排的 trace-ship-net 会占用该网段
        - subnet: 172.29.0.0/16
