services:
  # PostgreSQL 主库
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:${POSTGRES_VERSION:-16}
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-postgres
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-release_manager}
      POSTGRES_USER: ${POSTGRES_USER:-release_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ReleaseManager@2024}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - release_manager_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-release_manager} -d ${POSTGRES_DB:-release_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/会话/任务队列
  redis:
    image: ${IMAGE_PREFIX:-}redis:${REDIS_VERSION:-7}
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-redis
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-ReleaseManager@2024} --appendonly yes
    networks:
      - release_manager_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Gitea Git 仓库（可替代 GitLab，轻量）
  gitea:
    image: ${IMAGE_PREFIX:-}gitea/gitea:${GITEA_VERSION:-1.21}
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-gitea
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-Gitea@2024}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HTTP_PORT:-3000}/
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__admin__USER: ${GITEA_ADMIN_USER:-gitea_admin}
      GITEA__admin__PASSWORD: ${GITEA_ADMIN_PASSWORD:-GiteaAdmin@2024}
      GITEA__admin__EMAIL: ${GITEA_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - release_manager_net
    depends_on:
      postgres:
        condition: service_healthy

  # Jenkins 自动打包
  jenkins:
    image: ${IMAGE_PREFIX:-}jenkins/jenkins:${JENKINS_VERSION:-lts}
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-jenkins
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-Jenkins@2024}
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jenkins/plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
      - ./jenkins/init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - release_manager_net

  # OpenLDAP 域账号服务（本地构建，避免依赖 Docker Hub 上第三方镜像的可用性）
  openldap:
    build: ./openldap
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-openldap
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-LDAPAdmin@2024}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAP_SSL_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/openldap/openldap-data
    networks:
      - release_manager_net

  # phpLDAPadmin LDAP 管理界面
  phpldapadmin:
    image: ${IMAGE_PREFIX:-}osixia/phpldapadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-phpldapadmin
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-8090}:80"
    networks:
      - release_manager_net
    depends_on:
      - openldap

  # SVN 仓库服务（本地构建，避免依赖 Docker Hub 上第三方镜像的可用性）
  svn:
    build: ./svn
    container_name: ${COMPOSE_PROJECT_NAME:-release-manager-dev}-svn
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${SVN_PORT:-3690}:3690"
    volumes:
      - svn_data:/var/svn
    networks:
      - release_manager_net

volumes:
  postgres_data:
  redis_data:
  gitea_data:
  jenkins_home:
  ldap_data:
  svn_data:

networks:
  release_manager_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
